# VulnHunter-White Docker edition (Windows Docker Desktop / Linux Engine).
# Run via start.cmd or start.sh in this directory — do not place compose at repo root.
services:
  vulnhunter:
    build:
      context: ../..
      dockerfile: docker/desktop/Dockerfile
    image: vulnhunter/app:desktop
    container_name: vulnhunter-desktop
    user: "${VULNHUNTER_UID:-0}:${VULNHUNTER_GID:-0}"
    group_add:
      - "${DOCKER_GID:-0}"
    ports:
      - "${VULNHUNTER_PORT:-16788}:16788"
    environment:
      VULNHUNTER_RUNTIME: docker
      VULNHUNTER_HOST: "0.0.0.0"
      VULNHUNTER_PORT: "16788"
      VULNHUNTER_HOST_DATA: ${VULNHUNTER_HOST_DATA}
      VULNHUNTER_DEMO_SEED: ${VULNHUNTER_DEMO_SEED:-1}
      HOME: /data
    volumes:
      - ../../data:/data${DOCKER_DATA_OPTS:-}
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - "${DOCKER_SECURITY_OPT:-no-new-privileges:false}"
    restart: unless-stopped
