[project]
name = "python-debug-mcp"
version = "0.1.0"
description = "MCP server for remote Python debugging via debugpy/DAP"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "debugpy>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools]
py-modules = ["main", "server", "dap_client", "debug_session"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
